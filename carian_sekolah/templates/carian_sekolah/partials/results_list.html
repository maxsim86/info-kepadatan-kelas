{% if schools %}
    <div class="list-group-item bg-light">
        <strong>{{ schools|length }}</strong> hasil ditemui
    </div>
    {% for school in schools %}
    <a href="#" class="list-group-item list-group-item-action" data-school-name="{{ school.name }}">
        <strong>{{ school.name }}</strong><br>
        <small class="text-muted">{{ school.address }}</small>
        
        {% if search_location_found %}
        <div class="mt-1">
            <span class="badge bg-primary rounded-pill">
                Anggaran: {{ school.distance.km|floatformat:2 }} km
            </span>
        </div>
        {% endif %}
    </a>
    {% endfor %}
{% else %}
    <!-- data-no-results="true" penting untuk logik panel sisi -->
    <div class="list-group-item" data-no-results="true">Tiada sekolah ditemui sepadan dengan carian anda.</div>
{% endif %}
