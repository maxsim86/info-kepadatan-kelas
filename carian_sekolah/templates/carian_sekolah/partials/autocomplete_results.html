{% if suggestions %}
<div class="list-group shadow-sm">
    {% for suggestion in suggestions %}
    <button type="button" 
            class="list-group-item list-group-item-action text-start" 
            onclick="selectAddress('{{ suggestion|escapejs }}')">
        <i class="bi bi-geo-alt text-muted me-2"></i> {{ suggestion }}
    </button>
    {% endfor %}
</div>
{% endif %}
