{% extends 'utama/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    body { background-color: #f4f7f6; }
    #map { height: 500px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .search-panel { background-color: white; padding: 1.5rem; border-radius: 8px; }
    #results-list { max-height: 400px; overflow-y: auto; }
    .list-group-item { cursor: pointer; }
    .list-group-item:hover { background-color: #e9ecef; }
    .htmx-indicator {
        display: none;
        border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #3498db;
        width: 20px; height: 20px; animation: spin 1s linear infinite; margin-left: 10px;
    }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request .btn-text { display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<div class="container my-4">
    <div class="row g-4">
        <!-- Panel Carian -->
        <div class="col-lg-4">
            <div class="search-panel shadow-sm">
                <h3 class="mb-3">Cari Sekolah</h3>
                <!-- BORANG KINI MENGGUNAKAN HTMX -->
                <form hx-get="{% url 'carian_sekolah:api_search_and_find' %}"
                      hx-target="#results-list"
                      hx-indicator="#loader">


                    <div class="mb-3">
    <!-- UBAH LABEL DAN PLACEHOLDER -->
    <label for="location-input" class="form-label">Cari Nama Sekolah atau Lokasi</label>
    <input type="text" name="location" id="location-input" class="form-control" 
           placeholder="cth: SMK Kota Kemuning atau 41200 Klang">
</div>


                    <div class="mb-3">
                        <label for="school-type-select" class="form-label">Jenis Sekolah</label>
                        <select id="school-type-select" name="type" class="form-select">
                            <option value="SEMUA" selected>Semua Jenis</option>
                            <option value="RENDAH">Sekolah Rendah</option>
                            <option value="MENENGAH">Sekolah Menengah</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="radius-select" class="form-label">Dalam Jarak</label>
                        <select id="radius-select" name="radius" class="form-select">
                            <option value="1">1 km</option>
                            <option value="3" selected>3 km</option>
                            <option value="5">5 km</option>
                            <option value="10.0">10 km</option>
                        </select>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary d-flex justify-content-center align-items-center">
                            <span class="btn-text">Cari</span>
                            <div id="loader" class="htmx-indicator"></div>
                        </button>
                    </div>
                </form>
            </div>
            <!-- Senarai Keputusan -->
            <div id="results-panel" class="mt-4">
                <h4 id="results-title">Sekolah Ditemui</h4>
                <!-- Hasil carian HTMX akan diletakkan di sini -->
                <div id="results-list" class="list-group">
                    <div class="list-group-item text-muted">Sila buat carian untuk melihat hasil.</div>
                </div>
            </div>
        </div>

        <!-- Peta -->
        <div class="col-lg-8">
            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    // 1. Inisialisasi Peta
    const map = L.map('map').setView([3.0449, 101.4456], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const schoolLayer = L.layerGroup().addTo(map);
    let userMarker;
    const markerReferences = {};

document.body.addEventListener('updateMap', function(evt) {
    const data = evt.detail;
    
    schoolLayer.clearLayers();
    if (userMarker) map.removeLayer(userMarker);

    // === TAMBAH SEMAKAN INI ===
    // Hanya letak penanda dan zum jika lokasi carian ditemui
    if (data.search_location) {
        userMarker = L.marker([data.search_location.lat, data.search_location.lon])
            .addTo(map)
            .bindPopup('Lokasi Carian Anda')
            .openPopup();
        map.flyTo([data.search_location.lat, data.search_location.lon], 14);
    }
    // ============================

    // Paparkan penanda sekolah (kod ini tidak berubah)
    if (data.schools.length > 0) {
        data.schools.forEach(school => {
            const marker = L.marker([school.lat, school.lon]).addTo(schoolLayer)
                .bindPopup(`<b>${school.name}</b>`);
            markerReferences[school.name] = marker;
        });
    }
});

    // 3. Logik untuk klik pada senarai hasil
    document.getElementById('results-list').addEventListener('click', function(e) {
        const targetItem = e.target.closest('.list-group-item');
        if (targetItem && targetItem.dataset.schoolName) {
            const schoolName = targetItem.dataset.schoolName;
            const marker = markerReferences[schoolName];
            if (marker) {
                map.flyTo(marker.getLatLng(), 16);
                marker.openPopup();
            }
        }
    });
});
</script>
{% endblock content %}
